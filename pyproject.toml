[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pilota"
version = "0.1.0"
description = "Programmable AI agents as ordinary Python expressions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kazbek" }]
dependencies = [
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
openrouter = [
    "httpx>=0.27,<1",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29,<1",
    "pymdown-extensions>=10.2,<12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pilota"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests that require an explicitly configured external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pilota"]
