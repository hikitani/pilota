[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pilota"
dynamic = ["version"]
description = "Programmable AI agents as ordinary Python expressions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazbek" }]
keywords = ["agents", "ai", "llm", "pydantic", "typed"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/hikitani/pilota"
Documentation = "https://hikitani.github.io/pilota/"
Source = "https://github.com/hikitani/pilota"
Issues = "https://github.com/hikitani/pilota/issues"

[project.optional-dependencies]
openrouter = [
    "httpx>=0.27,<1",
]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs-material>=9.6,<10",
    "mkdocstrings[python]>=0.29,<1",
    "pymdown-extensions>=10.2,<12",
]

[tool.hatch.version]
path = "src/pilota/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/pilota"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests that require an explicitly configured external service",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pilota"]
